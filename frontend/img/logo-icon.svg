<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Fresh Leaf / Organic Accent Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Soft Glow Shadow -->
    <filter id="badgeShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="8" y="8" width="104" height="104" rx="30" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  
  <!-- Subtle Top Rim Light -->
  <rect x="9" y="9" width="102" height="51" rx="28" fill="url(#glassTop)"/>

  <!-- Modern Cow Silhouette & Milk Drop Fusion -->
  <!-- Left Horn -->
  <path d="M34 42 C27 38, 24 28, 30 23 C36 28, 41 36, 42 43 Z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Right Horn -->
  <path d="M86 42 C93 38, 96 28, 90 23 C84 28, 79 36, 78 43 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Cow Ears -->
  <ellipse cx="28" cy="49" rx="10" ry="5.5" transform="rotate(-25 28 49)" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="92" cy="49" rx="10" ry="5.5" transform="rotate(25 92 49)" fill="#FFFFFF" opacity="0.9"/>

  <!-- Pure Milk Drop Silhouette (Forms the Head) -->
  <path d="M60 22 C49 38, 34 53, 34 72 C34 87, 45 97, 60 97 C75 97, 86 87, 86 72 C86 53, 71 38, 60 22 Z" fill="#FFFFFF"/>

  <!-- Friendly Modern Cow Eyes -->
  <circle cx="48" cy="56" r="3.5" fill="#1E293B"/>
  <circle cx="72" cy="56" r="3.5" fill="#1E293B"/>
  <circle cx="49" cy="55" r="1.2" fill="#FFFFFF"/>
  <circle cx="73" cy="55" r="1.2" fill="#FFFFFF"/>

  <!-- Snout / Muzzle Area with Pure Morning Drop Wave -->
  <ellipse cx="60" cy="76" rx="16" ry="12" fill="#F1F5F9"/>
  
  <!-- Nostrils -->
  <ellipse cx="54" cy="74" rx="2.2" ry="3" fill="#64748B"/>
  <ellipse cx="66" cy="74" rx="2.2" ry="3" fill="#64748B"/>

  <!-- Gentle Smile -->
  <path d="M55 82 Q60 86 65 82" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Fresh Organic Green Sprout on Forehead (Purity/Freshness Badge) -->
  <path d="M60 44 C56 38, 48 40, 52 47 C55 46, 58 45, 60 44 Z" fill="url(#leafGrad)"/>
  <path d="M60 44 C64 38, 72 40, 68 47 C65 46, 62 45, 60 44 Z" fill="url(#leafGrad)"/>

  <!-- Sparkle of Purity -->
  <path d="M94 20 L96 26 L102 28 L96 30 L94 36 L92 30 L86 28 L92 26 Z" fill="url(#goldGrad)"/>
</svg>
